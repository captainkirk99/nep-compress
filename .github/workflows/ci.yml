name: Build and test compression

on:
  push:
  pull_request:

jobs:
  compression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lz4-c
            lz4: "ON"
            bzip2: "OFF"
            jpegls: "OFF"
            fortran: "OFF"
            asan: "OFF"
          - name: bzip2-fortran
            lz4: "OFF"
            bzip2: "ON"
            jpegls: "ON"
            fortran: "ON"
            asan: "OFF"
          - name: both-fortran
            lz4: "ON"
            bzip2: "ON"
            jpegls: "ON"
            fortran: "ON"
            asan: "OFF"
          - name: lz4-c-asan
            lz4: "ON"
            bzip2: "OFF"
            jpegls: "ON"
            fortran: "OFF"
            asan: "ON"
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          init-shell: bash
          cache-environment: true

      - name: Check dependency stack and external plugin
        run: |
          set -euo pipefail
          echo "HDF5 prefix: ${CONDA_PREFIX}"
          nc-config --version
          nf-config --version
          nc-config --has-zstd --has-szlib
          pkg-config --modversion netcdf hdf5 liblz4
          if command -v h5cc >/dev/null; then
            h5cc -showconfig | sed -n '1,10p'
          fi
          BZIP2_PLUGIN_DIR="$(python -c 'import hdf5plugin; print(hdf5plugin.PLUGINS_PATH)')"
          test -d "${BZIP2_PLUGIN_DIR}"
          echo "External plugin directory: ${BZIP2_PLUGIN_DIR}"
          echo "BZIP2_PLUGIN_DIR=${BZIP2_PLUGIN_DIR}" >> "${GITHUB_ENV}"
          echo "ZSTD_PLUGIN_DIR=${BZIP2_PLUGIN_DIR}" >> "${GITHUB_ENV}"
          echo "JPEGLS_PLUGIN_DIR=${BZIP2_PLUGIN_DIR}" >> "${GITHUB_ENV}"
          ls "${BZIP2_PLUGIN_DIR}"

      - name: Configure
        run: |
          set -euo pipefail
          ASAN_FLAGS=()
          if [[ "${{ matrix.asan }}" == "ON" ]]; then
            ASAN_FLAGS=(-DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
              -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" -DHDF5_ROOT="${CONDA_PREFIX}" \
            -DNEPCOMPRESS_BUILD_LZ4=${{ matrix.lz4 }} \
            -DNEPCOMPRESS_BUILD_BZIP2=${{ matrix.bzip2 }} \
            -DNEPCOMPRESS_BUILD_JPEGLS=${{ matrix.jpegls }} \
            -DNEPCOMPRESS_ENABLE_FORTRAN=${{ matrix.fortran }} \
            -DNEPCOMPRESS_BZIP2_PLUGIN_DIR="${BZIP2_PLUGIN_DIR}" \
            -DNEPCOMPRESS_JPEGLS_PLUGIN_DIR="${JPEGLS_PLUGIN_DIR}" \
            -DNEPCOMPRESS_ZSTD_PLUGIN_DIR="${ZSTD_PLUGIN_DIR}" \
            "${ASAN_FLAGS[@]}" \
            -DBUILD_TESTING=ON
          ctest --test-dir build -N | tee build/test-list.txt
          if [[ "${{ matrix.bzip2 }}" == "ON" ]]; then
            grep -q 'tst_h_bzip2' build/test-list.txt
            grep -q 'bzip2_roundtrip' build/test-list.txt
          else
            echo "BZIP2 explicitly disabled in this matrix entry"
            if grep -q 'tst_h_bzip2' build/test-list.txt; then exit 1; fi
          fi
          if [[ "${{ matrix.lz4 }}" == "ON" ]]; then
            grep -q 'tst_h_lz4' build/test-list.txt
            grep -q 'tst_lz4_filters' build/test-list.txt
          fi
          if [[ "${{ matrix.jpegls }}" == "ON" ]]; then
            grep -q 'tst_jpegls' build/test-list.txt
            grep -q 'jpegls_missing_plugin' build/test-list.txt
          else
            if grep -q 'tst_jpegls' build/test-list.txt; then exit 1; fi
          fi
          grep -q 'perf_compare_filters' build/test-list.txt

      - name: Build and test
        run: |
          set -euo pipefail
          if [[ "${{ matrix.asan }}" == "ON" ]]; then
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error --parallel 2

      - name: Upload compare-filters CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-filters-${{ matrix.name }}
          path: build/performance/perf_compare_filters/compare_filters.csv

      - name: Install and build downstream consumer
        if: matrix.asan != 'ON'
        run: |
          set -euo pipefail
          cmake --install build --prefix "${PWD}/build/stage"
          cmake -S test/consumer -B build/consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="${PWD}/build/stage;${CONDA_PREFIX}"
          cmake --build build/consumer/build
          build/consumer/build/consumer_c
          if [[ "${{ matrix.fortran }}" == "ON" ]]; then
            build/consumer/build/consumer_fortran
          fi

  docs:
    runs-on: ubuntu-latest
    name: docs
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build documentation
        run: |
          set -euo pipefail
          cmake -DNEPC_OUTPUT_DIR=build/docs \
            -DNEPC_WARN_AS_ERROR=FAIL_ON_WARNINGS \
            -P docs/build_docs.cmake
